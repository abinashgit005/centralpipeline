name: Central Build Pipeline

on:
  repository_dispatch:
    types: [run-pipeline]
  workflow_dispatch:

env:
  PROJECT_ID: poc101-500018
  REGION: asia-south1
  REPO: gcppoc

jobs:
  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.PLATFORM_APP_ID }}
          private-key: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
          owner: ${{ github.event.client_payload.org }}

      - name: Checkout Developer Code
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.repo }}
          ref: ${{ github.event.client_payload.sha }}
          token: ${{ steps.app-token.outputs.token }}

      # ── Read platform.yaml from developer repo ──
      - name: Read platform.yaml
        id: platform
        run: |
          # Read values from platform.yaml
          APP_NAME=$(grep 'name:' platform.yaml | head -1 | awk '{print $2}')
          APP_PORT=$(grep 'port:' platform.yaml | awk '{print $2}')
          APP_REPLICAS=$(grep 'replicas:' platform.yaml | awk '{print $2}')

          # If platform.yaml missing → use repo name as default
          if [ -z "$APP_NAME" ]; then
            APP_NAME=$(echo "${{ github.event.client_payload.repo }}" | cut -d'/' -f2)
          fi
          if [ -z "$APP_PORT" ]; then APP_PORT=80; fi
          if [ -z "$APP_REPLICAS" ]; then APP_REPLICAS=1; fi

          echo "app_name=${APP_NAME}" >> $GITHUB_OUTPUT
          echo "app_port=${APP_PORT}" >> $GITHUB_OUTPUT
          echo "app_replicas=${APP_REPLICAS}" >> $GITHUB_OUTPUT

          echo "App: ${APP_NAME}, Port: ${APP_PORT}, Replicas: ${APP_REPLICAS}"

      - name: Post Pending Status
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.event.client_payload.repo }}/statuses/${{ github.event.client_payload.sha }} \
            -d '{"state":"pending","description":"Pipeline running...","context":"platform-ci/build"}'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      # ── Build with dynamic app name ──
      - name: Build Docker Image
        run: |
          IMAGE_NAME=${{ steps.platform.outputs.app_name }}
          SHA=${{ github.event.client_payload.sha }}
          docker build \
            -t ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${IMAGE_NAME}:${SHA} \
            . 2>&1 | tee /tmp/build-output.txt
          exit ${PIPESTATUS[0]}
      - name: Push Docker Image
        run: |
          IMAGE_NAME=${{ steps.platform.outputs.app_name }}
          SHA=${{ github.event.client_payload.sha }}
          docker push \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${IMAGE_NAME}:${SHA} \
            2>&1 | tee /tmp/push-output.txt
          exit ${PIPESTATUS[0]}

      # ── Update ArgoCD config dynamically ──
      - name: Update ArgoCD Config
        run: |
          git config --global user.email "pipeline@platform.com"
          git config --global user.name "Central Pipeline"

          APP_NAME=${{ steps.platform.outputs.app_name }}
          APP_PORT=${{ steps.platform.outputs.app_port }}
          APP_REPLICAS=${{ steps.platform.outputs.app_replicas }}
          SHA=${{ github.event.client_payload.sha }}

          git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/abinashgit005/argocd-config.git
          cd argocd-config

          mkdir -p apps/${APP_NAME}/dev

          # Generate manifest dynamically
          cat > apps/${APP_NAME}/dev/deployment.yaml << EOF
          apiVersion: v1
          kind: Namespace
          metadata:
            name: dev
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: ${APP_NAME}
            namespace: dev
          spec:
            replicas: ${APP_REPLICAS}
            selector:
              matchLabels:
                app: ${APP_NAME}
            template:
              metadata:
                labels:
                  app: ${APP_NAME}
              spec:
                containers:
                - name: ${APP_NAME}
                  image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/${APP_NAME}:${SHA}
                  ports:
                  - containerPort: ${APP_PORT}
                  resources:
                    requests:
                      memory: "128Mi"
                      cpu: "100m"
                    limits:
                      memory: "256Mi"
                      cpu: "200m"
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: ${APP_NAME}-service
            namespace: dev
          spec:
            selector:
              app: ${APP_NAME}
            ports:
            - protocol: TCP
              port: 80
              targetPort: ${APP_PORT}
            type: LoadBalancer
          EOF

          git add .
          git commit -m "Deploy ${APP_NAME}:${SHA} to DEV"
          git push

      - name: Post Success Status
        if: success()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.event.client_payload.repo }}/statuses/${{ github.event.client_payload.sha }} \
            -d '{"state":"success","description":"Deployed to DEV!","context":"platform-ci/build"}'

      - name: Post Failure Status
        if: failure()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ steps.app-token.outputs.token }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/${{ github.event.client_payload.repo }}/statuses/${{ github.event.client_payload.sha }} \
            -d '{"state":"failure","description":"Pipeline failed!","context":"platform-ci/build"}'

      # LAST STEP - AI Failure Analysis using Gemini 2.5 Flash
      - name: AI Failure Analysis
        if: failure()
        env:
          APP_NAME: ${{ steps.platform.outputs.app_name }}
          SHA: ${{ github.event.client_payload.sha }}
          REPO: ${{ github.event.client_payload.repo }}
          GITHUB_TOKEN_VAL: ${{ steps.app-token.outputs.token }}
        run: |
          echo "Starting AI Failure Analysis..."

          # Collect error logs
          ERROR_LOG=""
          for f in /tmp/build-output.txt /tmp/push-output.txt; do
            if [ -f "$f" ]; then
              ERROR_LOG="${ERROR_LOG}$(tail -20 $f)"
            fi
          done

          # Clean log for JSON
          CLEAN_LOG=$(echo "$ERROR_LOG" | tr '\n' ' ' | tr '"' "'" | tr '\\' '/' | head -c 1000)

          echo "Error log captured: ${CLEAN_LOG}"

          # Get GCP access token
          ACCESS_TOKEN=$(gcloud auth print-access-token)

          # Call Gemini 2.5 Flash via Vertex AI
          AI_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            "https://aiplatform.googleapis.com/v1/projects/poc101-500018/locations/global/publishers/google/models/gemini-2.5-flash:generateContent" \
            -d "{\"contents\":[{\"role\":\"user\",\"parts\":[{\"text\":\"You are a DevOps expert. CI/CD pipeline failed for app '${APP_NAME}' at commit '${SHA}'. Error logs: ${CLEAN_LOG}. Provide: 1. Root Cause 2. How to Fix 3. Steps Developer Should Take 4. How to Prevent. Be concise and developer friendly.\"}]}]}")

          echo "Gemini Response: ${AI_RESPONSE}"

          # Extract AI explanation
          AI_EXPLANATION=$(echo "$AI_RESPONSE" | python3 -c "
          import sys, json
          try:
            data = json.load(sys.stdin)
            if 'candidates' in data:
              text = data['candidates'][0]['content']['parts'][0]['text']
              print(text)
            elif 'error' in data:
              print('Gemini Error:', data['error'].get('message', 'Unknown error'))
            else:
              print('Unexpected response:', json.dumps(data))
          except Exception as e:
            print('Parse error:', str(e))
          ")

          echo "AI Explanation: ${AI_EXPLANATION}"

          # Save to file
          echo "$AI_EXPLANATION" > /tmp/ai-explanation.txt

          # Post to developer's commit using Python for safe JSON
          python3 << PYEOF
import json, urllib.request, os

with open('/tmp/ai-explanation.txt') as f:
    ai_text = f.read().strip()

app_name = os.environ.get('APP_NAME', 'unknown')
sha = os.environ.get('SHA', 'unknown')
repo = os.environ.get('REPO', 'unknown')
token = os.environ.get('GITHUB_TOKEN_VAL', '')

body = f"""## \U0001f916 AI Pipeline Failure Analysis

{ai_text}

---
> **App:** {app_name}
> **Commit:** {sha}
> *Analyzed by Google Gemini 2.5 Flash* \U0001f916"""

payload = json.dumps({"body": body}).encode('utf-8')

req = urllib.request.Request(
    f"https://api.github.com/repos/{repo}/commits/{sha}/comments",
    data=payload,
    headers={
        "Authorization": f"token {token}",
        "Accept": "application/vnd.github.v3+json",
        "Content-Type": "application/json"
    },
    method="POST"
)

try:
    with urllib.request.urlopen(req) as r:
        print("Comment posted successfully! Status:", r.status)
except Exception as e:
    print("Error posting comment:", str(e))
PYEOF